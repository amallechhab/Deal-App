<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <title>DEAL — Publier une annonce</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="deal-pages.css">
  <script src="script.js?v=10" defer></script>
</head>
<body data-page="publish">
  <header class="site-header">
 <a class="brand" href="index.html" aria-label="DEAL, accueil"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M10 18.5a16 16 0 0 1 26-6l3 3.5M38 8v8h-8M38 29.5a16 16 0 0 1-26 6L9 32m0 8v-8h8" /><path d="m18 25 4 4 9-11" /></svg></span><span class="wordmark">deal<span>.</span></span></a>
 <nav class="main-nav" aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="annonces.html">Annonces</a><a href="publier.html" class="is-active">Publier</a><a href="outils.html">Le projet</a></nav>
 <div class="header-actions"><span class="header-location">⌖ Maroc</span><a class="button button-outline header-login" href="connexion.html">Se connecter</a></div>
</header>

  <main class="page-shell publish-page">
    <div class="breadcrumbs"><a href="index.html">Accueil</a><span aria-hidden="true">/</span><span>Publier</span></div>
    <h1 class="publish-title" id="publish-title">Publier une annonce</h1>

    <form id="publish-form" class="publish-form">
      <label>Titre
        <input name="titre" required maxlength="150" placeholder="Ex : iPhone 13 · 128 Go">
      </label>
      <label>Prix (MAD)
        <input name="prix" type="number" step="0.01" min="1" required placeholder="6500">
      </label>
      <div class="deal-field-pair">
        <label>Pays
          <select name="pays" id="publish-country" required><option value="Maroc">Maroc</option></select>
        </label>
        <label>Ville
          <input name="ville" id="publish-city" list="publish-cities" required maxlength="100" placeholder="Ex : Tanger" autocomplete="off">
          <datalist id="publish-cities"></datalist>
        </label>
      </div>
      <div class="deal-field-pair">
        <label>Catégorie
          <select name="categorie" id="publish-category" required>
            <option value="voitures">Voitures</option>
            <option value="immobilier">Immobilier</option>
            <option value="telephones">Téléphones</option>
            <option value="mode">Mode</option>
          </select>
        </label>
        <label>Type d'annonce
          <select name="type_annonce" id="publish-type"><option value="">Choisir un type (facultatif)</option></select>
        </label>
      </div>
      <label>Description
        <textarea name="description" rows="4" required minlength="10" placeholder="Décrivez votre article"></textarea>
      </label>
      <label>Photos
        <input name="photo" id="publish-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required>
        <small class="deal-field-hint">Choisissez 1 à 5 photos · JPG, PNG ou WebP · 2 Mo maximum par photo</small>
      </label>
      <div id="photo-preview" class="deal-multi-photo-preview" hidden aria-live="polite"></div>
      <input type="hidden" name="specs" value="">
      <button class="button button-primary" id="publish-button" type="submit">Publier</button>
      <p id="message" class="publish-message" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
 <a class="brand footer-brand" href="index.html" aria-label="Retour à l'accueil"><span class="wordmark">deal<span>.</span></span></a>
 <nav class="deal-footer-links" aria-label="Navigation de pied de page"><a href="index.html">Accueil</a><a href="annonces.html">Annonces</a><a href="publier.html">Publier</a><a href="outils.html">Le projet</a></nav>
 <span>© 2026 DEAL · Projet de formation</span>
</footer>


  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
