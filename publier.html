f)"><label for="upload2">Ou choisir une photo 2 (max 2 Mo)</label><input id="upload2" name="upload2" type="file" accept="image/png,image/jpeg,image/webp"><label for="photo3">URL troisième photo</label><input id="photo3" name="photo3" type="url" placeholder="Lien de photo (facultatif)"><label for="upload3">Ou choisir une photo 3 (max 2 Mo)</label><input id="upload3" name="upload3" type="file" accept="image/png,image/jpeg,image/webp"><label for="specs">Caractéristiques (séparées par des virgules)</label><input id="specs" name="specs" type="text" ><button class="button button-primary" type="submit">Enregistrer l’annonce</button></form></section></main><footer class="site-footer"><a class="brand" href="index.html">DEAL</a><p>Les bonnes affaires au Maroc.</p><span>© 2026 DEAL</span></footer><div class="toast" id="toast" role="status"></div></body></html>
